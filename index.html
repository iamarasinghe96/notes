<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Progress Notes – AWH</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  /* ── ALIGNMENT KNOBS ────────────────────────────────────────────────────
     Tune with the panel below, then paste the :root block here and
     delete the #controls div + its <script> block.                        */
  :root {
    --table-top:        42mm;   /* top edge of table from top of page      */
    --table-left:       21mm;   /* left edge of table from left of page    */
    --date-col-width:  19.5mm; /* width of Date/Time column               */
    --notes-col-width: 157mm;   /* width of Notes column                   */
    --row-height:      6.83mm; /* height of every row incl. header        */

    /* Patient ID label box */
    --pid-top:         14mm;
    --pid-left:        125.5mm;
    --pid-width:       70.5mm;
    --pid-row-height:  7.1mm;
    --pid-dob-sex-gap: 10mm;
    --pid-sex-width:   20mm;
  }

  /* ── PAGE SETUP ─────────────────────────────────────────────────────── */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #888;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12mm;
    padding: 0 0 24mm;
  }

  /* Scale A4 pages to fit viewport width on small screens */
  @media (max-width: 220mm) {
    .page {
      transform-origin: top center;
      transform: scale(calc(100vw / 210mm));
      margin-bottom: calc((100vw / 210mm - 1) * 297mm);
    }
  }

  .page {
    position: relative;
    width:  210mm;
    height: 297mm;
    background: #fff;
    background-size: 100% 100%;
    background-position: top left;
    background-repeat: no-repeat;
    box-shadow: 0 4px 16px #0006;
  }

  /* backgrounds applied directly via JS inline style */

  /* ── TABLE OVERLAY ───────────────────────────────────────────────────── */
  .overlay-table {
    position: absolute;
    top:  var(--table-top);
    left: var(--table-left);
    width: calc(var(--date-col-width) + var(--notes-col-width));
    border-collapse: collapse;
    table-layout: fixed;
  }

  .overlay-table th,
  .overlay-table td {
    height:  var(--row-height);
    border:  1px solid #000;        /* 1px – always visible on screen */
    padding: 0 1.5mm;
    vertical-align: middle;
    overflow: hidden;
    background: transparent;
  }

  .col-date  { width: var(--date-col-width);  }
  .col-notes { width: var(--notes-col-width); }

  .overlay-table thead th {
    font: 700 6.5pt Arial, sans-serif;
    text-align: center;
    background: rgba(255,255,255,0.6);
  }

  .overlay-table tbody td input,
  .overlay-table tbody td textarea {
    width: 100%;
    border: none;
    background: transparent;
    font: 8pt Arial, sans-serif;
    padding: 0;
    outline: none;
    box-sizing: border-box;
  }

  .overlay-table tbody td input {
    height: 100%;
  }

  .overlay-table tbody td:first-child input {
    text-align: center;
  }

  .overlay-table tbody td input.notes-input {
    height: 100%;
  }

  /* ── PATIENT ID OVERLAY ─────────────────────────────────────────────── */
  .patient-id {
    position: absolute;
    top:   var(--pid-top);
    left:  var(--pid-left);
    width: var(--pid-width);
    font:  8pt Arial, sans-serif;
  }

  .patient-id .pid-row {
    display: flex;
    align-items: baseline;
    height: var(--pid-row-height);
    gap: 1mm;
  }

  .patient-id .pid-row input {
    flex: 1;
    border: none;
    background: transparent;
    font: 8pt Arial, sans-serif;
    padding: 0 1mm;
    outline: none;
    min-width: 0;
  }

  .pid-dob-sex {
    display: flex;
    align-items: baseline;
    height: var(--pid-row-height);
    gap: var(--pid-dob-sex-gap);
  }

  .pid-dob-sex .pid-dob {
    display: flex;
    align-items: baseline;
    gap: 1mm;
    flex: 2;
  }

  .pid-dob-sex .pid-sex {
    display: flex;
    align-items: baseline;
    gap: 1mm;
    flex: 0 0 var(--pid-sex-width);
    min-width: 0;
    overflow: hidden;
  }

  .pid-dob-sex input {
    flex: 1;
    border: none;
    background: transparent;
    font: 8pt Arial, sans-serif;
    padding: 0 1mm;
    outline: none;
    min-width: 0;
  }

  /* ── ACTION BUTTONS ─────────────────────────────────────────────────── */
  .action-btns {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    flex-direction: row;
    gap: 10px;
    padding: 8px 12px;
    background: #666;
    width: 100%;
    box-sizing: border-box;
  }

  .action-btns button {
    writing-mode: horizontal-tb;
    transform: none;
    width: auto;
    height: 44px;
    flex: 1;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font: bold 13px Arial, sans-serif;
    letter-spacing: 0.3px;
  }

  #btn-pdf   { background: #1a73e8; color: #fff; }
  #btn-pdf:hover { background: #1558b0; }
  #btn-clear { background: #d93025; color: #fff; }
  #btn-clear:hover { background: #b0261c; }

  @page {
    size: A4;
    margin: 0;
  }

  @media print {
    html, body {
      width: 210mm;
      margin: 0;
      padding: 0;
      gap: 0;
      background: none;
    }
    .action-btns { display: none; }
    .page {
      width: 210mm;
      height: 297mm;
      box-shadow: none;
      margin: 0;
      padding: 0;
      overflow: hidden;
      break-after: page;
      page-break-after: always;
      break-inside: avoid;
      page-break-inside: avoid;
      transform: none !important;
    }
    .overlay-table th, .overlay-table td { border-color: #000; }
  }
</style>
</head>
<body>

<div class="action-btns">
  <button id="btn-pdf"   onclick="downloadPDF()">⬇ Download PDF</button>
  <button id="btn-clear" onclick="clearData()">✕ Clear All</button>
</div>

<!-- ═══════════════════════════  PAGE 1  ═══════════════════════════ -->
<div class="page page-1">
  <div class="patient-id">
    <div class="pid-row">
      <input type="text" aria-label="UR No">
    </div>
    <div class="pid-row">
      <input type="text" aria-label="Surname">
    </div>
    <div class="pid-row">
      <input type="text" aria-label="Given Names">
    </div>
    <div class="pid-dob-sex">
      <div class="pid-dob">
        <input type="text" class="pid-dob-input" inputmode="numeric" placeholder="DD/MM/YYYY" aria-label="Date of Birth">
      </div>
      <div class="pid-sex">
        <input type="text" class="pid-sex-input" list="sex-options" aria-label="Sex">
      </div>
    </div>
  </div>
  <table class="overlay-table">
    <colgroup>
      <col class="col-date">
      <col class="col-notes">
    </colgroup>
    <thead>
      <tr>
        <th>Date / Time</th>
        <th>Please sign each entry and print surname and designation</th>
      </tr>
    </thead>
    <tbody id="body1"></tbody>
  </table>
</div>

<!-- ═══════════════════════════  PAGE 2  ═══════════════════════════ -->
<div class="page page-2">
  <div class="patient-id">
    <div class="pid-row">
      <input type="text" aria-label="UR No">
    </div>
    <div class="pid-row">
      <input type="text" aria-label="Surname">
    </div>
    <div class="pid-row">
      <input type="text" aria-label="Given Names">
    </div>
    <div class="pid-dob-sex">
      <div class="pid-dob">
        <input type="text" class="pid-dob-input" inputmode="numeric" placeholder="DD/MM/YYYY" aria-label="Date of Birth">
      </div>
      <div class="pid-sex">
        <input type="text" class="pid-sex-input" list="sex-options" aria-label="Sex">
      </div>
    </div>
  </div>
  <table class="overlay-table">
    <colgroup>
      <col class="col-date">
      <col class="col-notes">
    </colgroup>
    <thead>
      <tr>
        <th>Date / Time</th>
        <th>Please sign each entry and print surname and designation</th>
      </tr>
    </thead>
    <tbody id="body2"></tbody>
  </table>
</div>


<datalist id="sex-options">
  <option value="Male">
  <option value="Female">
</datalist>

<!-- base64 backgrounds (edit assets/backgrounds.js to fill in your PNGs) -->
<script src="assets/backgrounds.js"></script>
<script>
  const root = document.documentElement;

  // Build data URIs from whatever format was pasted (raw b64 or full data: URI)
  function toDataUri(val) {
    if (!val || val.startsWith('PASTE')) return null;
    return val.startsWith('data:') ? val : `data:image/png;base64,${val}`;
  }

  const bgPage1 = (typeof PAGE1_B64 !== 'undefined') ? toDataUri(PAGE1_B64) : null;
  const bgPage2 = (typeof PAGE2_B64 !== 'undefined') ? toDataUri(PAGE2_B64) : null;

  const elPage1 = document.querySelector('.page-1');
  const elPage2 = document.querySelector('.page-2');

  function setBgVisible(visible) {
    if (elPage1) elPage1.style.backgroundImage = (visible && bgPage1) ? `url(${bgPage1})` : '';
    if (elPage2) elPage2.style.backgroundImage = (visible && bgPage2) ? `url(${bgPage2})` : '';
  }

  // Show background on load
  setBgVisible(true);

  // Measure pixel width of a string using canvas (same font as inputs)
  const _canvas = document.createElement('canvas');
  const _ctx = _canvas.getContext('2d');
  function textWidth(str, font) {
    _ctx.font = font;
    return _ctx.measureText(str).width;
  }

  // Build 35 data rows per page
  function buildRows(tbodyId) {
    const tbody = document.getElementById(tbodyId);
    for (let i = 0; i < 35; i++) {
      const tr = document.createElement('tr');
      tr.innerHTML =
        `<td><input type="text" aria-label="Date/Time ${i+1}"></td>` +
        `<td><input type="text" class="notes-input" aria-label="Notes ${i+1}"></td>`;
      tbody.appendChild(tr);
    }
  }
  buildRows('body1');
  buildRows('body2');

  // Wire up line-flow behaviour for each table body
  document.querySelectorAll('.overlay-table tbody').forEach(tbody => {
    const notes = Array.from(tbody.querySelectorAll('input.notes-input'));

    notes.forEach((inp, idx) => {
      // Flow forward: push overflow text to next row
      inp.addEventListener('input', () => {
        if (idx >= notes.length - 1) return;
        const font = getComputedStyle(inp).font;
        const maxW = inp.clientWidth;
        if (textWidth(inp.value, font) <= maxW) return;

        // Find last character that still fits
        let cut = inp.value.length;
        while (cut > 0 && textWidth(inp.value.slice(0, cut), font) > maxW) cut--;

        // Prefer splitting at a word boundary
        const wordBound = inp.value.lastIndexOf(' ', cut);
        if (wordBound > 0) cut = wordBound + 1;

        const overflow = inp.value.slice(cut);
        inp.value = inp.value.slice(0, cut).trimEnd();

        const next = notes[idx + 1];
        next.value = overflow + next.value;
        next.focus();
        next.setSelectionRange(overflow.length, overflow.length);
      });

      // Flow back: Backspace at position 0 jumps to end of previous row
      inp.addEventListener('keydown', e => {
        if (e.key === 'Backspace' && inp.selectionStart === 0 && inp.selectionEnd === 0 && idx > 0) {
          e.preventDefault();
          const prev = notes[idx - 1];
          prev.focus();
          prev.setSelectionRange(prev.value.length, prev.value.length);
        }
      });
    });
  });

  // DOB auto-slash (DD/MM/YYYY, numeric keyboard)
  document.querySelectorAll('.pid-dob-input').forEach(inp => {
    inp.addEventListener('keydown', e => {
      if (e.key === 'Backspace') {
        // If the char before cursor is a slash, remove the slash too
        const pos = inp.selectionStart;
        if (pos > 0 && inp.value[pos - 1] === '/') {
          e.preventDefault();
          inp.value = inp.value.slice(0, pos - 1) + inp.value.slice(pos);
          inp.setSelectionRange(pos - 1, pos - 1);
        }
      }
    });
    inp.addEventListener('input', () => {
      const pos = inp.selectionStart;
      const digits = inp.value.replace(/\D/g, '').slice(0, 8);
      let fmt = digits.slice(0, 2);
      if (digits.length > 2) fmt += '/' + digits.slice(2, 4);
      if (digits.length > 4) fmt += '/' + digits.slice(4, 8);
      inp.value = fmt;
      // Restore cursor, accounting for inserted slashes
      const slashes = (fmt.slice(0, pos).match(/\//g) || []).length;
      inp.setSelectionRange(pos + slashes, pos + slashes);
    });
  });

  // Sex smart dropdown: m → Male, f → Female
  document.querySelectorAll('.pid-sex-input').forEach(inp => {
    inp.addEventListener('keydown', e => {
      if (e.key.toLowerCase() === 'm') { e.preventDefault(); inp.value = 'Male'; }
      else if (e.key.toLowerCase() === 'f') { e.preventDefault(); inp.value = 'Female'; }
    });
  });

  // ── LOCAL STORAGE PERSISTENCE ───────────────────────────────────────
  const STORAGE_KEY = 'progress-notes-v1';

  function allInputs() {
    return Array.from(document.querySelectorAll('input'));
  }

  function saveData() {
    const values = allInputs().map(inp => inp.value);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(values));
  }

  function loadData() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const values = JSON.parse(raw);
    allInputs().forEach((inp, i) => {
      if (values[i] !== undefined) inp.value = values[i];
    });
  }

  function clearData() {
    if (!confirm('Are you sure you want to clear all data? This cannot be undone.')) return;
    localStorage.removeItem(STORAGE_KEY);
    allInputs().forEach(inp => { inp.value = ''; });
  }

  // Save on any input change
  document.addEventListener('input', saveData);

  // Restore on page load (after rows are built)
  loadData();

  // ── PDF DOWNLOAD ─────────────────────────────────────────────────────
  async function downloadPDF() {
    const btn = document.getElementById('btn-pdf');
    btn.textContent = 'Generating…';
    btn.disabled = true;

    try {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
      const pages = document.querySelectorAll('.page');

      for (let i = 0; i < pages.length; i++) {
        const canvas = await html2canvas(pages[i], {
          scale: 3,
          useCORS: true,
          allowTaint: true,
          backgroundColor: '#ffffff',
          width: pages[i].offsetWidth,
          height: pages[i].offsetHeight,
        });

        const imgData = canvas.toDataURL('image/jpeg', 1.0);
        if (i > 0) pdf.addPage();
        pdf.addImage(imgData, 'JPEG', 0, 0, 210, 297);
      }

      pdf.save('progress-notes.pdf');
    } finally {
      btn.textContent = '⬇ Download PDF';
      btn.disabled = false;
    }
  }

</script>
</body>
</html>
