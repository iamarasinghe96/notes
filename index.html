<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Progress Notes – AWH</title>
<style>
  /* ── ALIGNMENT KNOBS ────────────────────────────────────────────────────
     Tune with the panel below, then paste the :root block here and
     delete the #controls div + its <script> block.                        */
  :root {
    --table-top:        42mm;   /* top edge of table from top of page      */
    --table-left:       21mm;   /* left edge of table from left of page    */
    --date-col-width:  19.5mm; /* width of Date/Time column               */
    --notes-col-width: 157mm;   /* width of Notes column                   */
    --row-height:      6.83mm; /* height of every row incl. header        */

    /* Patient ID label box */
    --pid-top:         8mm;
    --pid-left:        109mm;
    --pid-width:       90mm;
  }

  /* ── PAGE SETUP ─────────────────────────────────────────────────────── */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #888;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12mm;
    padding: 12mm 0 24mm;
  }

  .page {
    position: relative;
    width:  210mm;
    height: 297mm;
    background: #fff;
    background-size: 100% 100%;
    background-position: top left;
    background-repeat: no-repeat;
    box-shadow: 0 4px 16px #0006;
  }

  /* backgrounds applied directly via JS inline style */

  /* ── TABLE OVERLAY ───────────────────────────────────────────────────── */
  .overlay-table {
    position: absolute;
    top:  var(--table-top);
    left: var(--table-left);
    width: calc(var(--date-col-width) + var(--notes-col-width));
    border-collapse: collapse;
    table-layout: fixed;
  }

  .overlay-table th,
  .overlay-table td {
    height:  var(--row-height);
    border:  1px solid #000;        /* 1px – always visible on screen */
    padding: 0 1.5mm;
    vertical-align: middle;
    overflow: hidden;
    background: transparent;
  }

  .col-date  { width: var(--date-col-width);  }
  .col-notes { width: var(--notes-col-width); }

  .overlay-table thead th {
    font: 700 6.5pt Arial, sans-serif;
    text-align: center;
    background: rgba(255,255,255,0.6);
  }

  .overlay-table tbody td input,
  .overlay-table tbody td textarea {
    width: 100%;
    border: none;
    background: transparent;
    font: 8pt Arial, sans-serif;
    padding: 0;
    outline: none;
    box-sizing: border-box;
  }

  .overlay-table tbody td input {
    height: 100%;
  }

  .overlay-table tbody td:first-child input {
    text-align: center;
  }

  .overlay-table tbody td input.notes-input {
    height: 100%;
  }

  /* ── ALIGNMENT CONTROL PANEL ─────────────────────────────────────────── */
  #controls {
    position: fixed;
    bottom: 12px;
    right:  12px;
    z-index: 999;
    background: #ffffffe8;
    border: 1px solid #aaa;
    border-radius: 8px;
    padding: 10px 14px 12px;
    font: 12px Arial, sans-serif;
    box-shadow: 0 2px 12px #0004;
    min-width: 300px;
  }
  #controls h3 {
    font-size: 13px;
    margin-bottom: 8px;
    border-bottom: 1px solid #ddd;
    padding-bottom: 4px;
  }
  .ctrl-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 5px;
  }
  .ctrl-row label {
    flex: 0 0 155px;
    font-size: 11px;
  }
  .ctrl-row input[type=range] {
    flex: 1;
    accent-color: #1a73e8;
  }
  .ctrl-row .val {
    flex: 0 0 40px;
    text-align: right;
    font: 11px/1 monospace;
    color: #1a73e8;
    font-weight: bold;
  }
  .ctrl-row-check {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 8px 0 4px;
    font-size: 11px;
  }
  .ctrl-row-check input { width: 15px; height: 15px; cursor: pointer; }
  #copy-btn {
    margin-top: 8px;
    width: 100%;
    padding: 6px;
    font-size: 12px;
    cursor: pointer;
    background: #1a73e8;
    color: #fff;
    border: none;
    border-radius: 4px;
  }
  #copy-btn:hover { background: #1558b0; }
  #copied-msg {
    font-size: 11px;
    color: green;
    text-align: center;
    margin-top: 4px;
    display: none;
  }

  /* ── PATIENT ID OVERLAY ─────────────────────────────────────────────── */
  .patient-id {
    position: absolute;
    top:   var(--pid-top);
    left:  var(--pid-left);
    width: var(--pid-width);
    font:  8pt Arial, sans-serif;
  }

  .patient-id .pid-row {
    display: flex;
    align-items: baseline;
    height: 6mm;
    gap: 1mm;
  }

  .patient-id .pid-row input {
    flex: 1;
    border: none;
    border-bottom: 1px solid #000;
    background: transparent;
    font: 8pt Arial, sans-serif;
    padding: 0 1mm;
    outline: none;
    min-width: 0;
  }

  .pid-dob-sex {
    display: flex;
    align-items: baseline;
    height: 6mm;
    gap: 3mm;
  }

  .pid-dob-sex .pid-dob {
    display: flex;
    align-items: baseline;
    gap: 1mm;
    flex: 2;
  }

  .pid-dob-sex .pid-sex {
    display: flex;
    align-items: baseline;
    gap: 1mm;
    flex: 1;
  }

  .pid-dob-sex input {
    flex: 1;
    border: none;
    border-bottom: 1px solid #000;
    background: transparent;
    font: 8pt Arial, sans-serif;
    padding: 0 1mm;
    outline: none;
    min-width: 0;
  }

  @media print {
    body { background: none; padding: 0; gap: 0; }
    .page { box-shadow: none; page-break-after: always; }
    #controls { display: none; }
    .overlay-table th, .overlay-table td { border-color: #000; }
  }
</style>
</head>
<body>

<!-- ═══════════════════════════  PAGE 1  ═══════════════════════════ -->
<div class="page page-1">
  <div class="patient-id">
    <div class="pid-row">
      <input type="text" aria-label="UR No">
    </div>
    <div class="pid-row">
      <input type="text" aria-label="Surname">
    </div>
    <div class="pid-row">
      <input type="text" aria-label="Given Names">
    </div>
    <div class="pid-dob-sex">
      <div class="pid-dob">
        <input type="text" aria-label="Date of Birth">
      </div>
      <div class="pid-sex">
        <input type="text" aria-label="Sex">
      </div>
    </div>
  </div>
  <table class="overlay-table">
    <colgroup>
      <col class="col-date">
      <col class="col-notes">
    </colgroup>
    <thead>
      <tr>
        <th>Date / Time</th>
        <th>Please sign each entry and print surname and designation</th>
      </tr>
    </thead>
    <tbody id="body1"></tbody>
  </table>
</div>

<!-- ═══════════════════════════  PAGE 2  ═══════════════════════════ -->
<div class="page page-2">
  <div class="patient-id">
    <div class="pid-row">
      <input type="text" aria-label="UR No">
    </div>
    <div class="pid-row">
      <input type="text" aria-label="Surname">
    </div>
    <div class="pid-row">
      <input type="text" aria-label="Given Names">
    </div>
    <div class="pid-dob-sex">
      <div class="pid-dob">
        <input type="text" aria-label="Date of Birth">
      </div>
      <div class="pid-sex">
        <input type="text" aria-label="Sex">
      </div>
    </div>
  </div>
  <table class="overlay-table">
    <colgroup>
      <col class="col-date">
      <col class="col-notes">
    </colgroup>
    <thead>
      <tr>
        <th>Date / Time</th>
        <th>Please sign each entry and print surname and designation</th>
      </tr>
    </thead>
    <tbody id="body2"></tbody>
  </table>
</div>

<!-- ═══════════ ALIGNMENT CONTROL PANEL (remove when done) ═══════════ -->
<div id="controls">
  <h3>Table Alignment Tool</h3>

  <div class="ctrl-row">
    <label>↕ Top offset (mm)</label>
    <input type="range" id="s-top"   min="30"  max="120" step="0.5"  value="42">
    <span class="val" id="v-top">42</span>
  </div>
  <div class="ctrl-row">
    <label>↔ Left offset (mm)</label>
    <input type="range" id="s-left"  min="-10" max="30"  step="0.5"  value="21">
    <span class="val" id="v-left">21</span>
  </div>
  <div class="ctrl-row">
    <label>Date/Time col width (mm)</label>
    <input type="range" id="s-date"  min="15"  max="60"  step="0.5"  value="19.5">
    <span class="val" id="v-date">19.5</span>
  </div>
  <div class="ctrl-row">
    <label>Notes col width (mm)</label>
    <input type="range" id="s-notes" min="80"  max="200" step="0.5"  value="157">
    <span class="val" id="v-notes">157</span>
  </div>
  <div class="ctrl-row">
    <label>Row height (mm)</label>
    <input type="range" id="s-row"   min="4"   max="12"  step="0.01" value="6.83">
    <span class="val" id="v-row">6.83</span>
  </div>

  <div class="ctrl-row-check">
    <input type="checkbox" id="toggle-bg" checked>
    <label for="toggle-bg">Show PNG background</label>
  </div>

  <button id="copy-btn">Copy CSS values</button>
  <div id="copied-msg">Copied to clipboard!</div>
</div>

<!-- base64 backgrounds (edit assets/backgrounds.js to fill in your PNGs) -->
<script src="assets/backgrounds.js"></script>
<script>
  const root = document.documentElement;

  // Build data URIs from whatever format was pasted (raw b64 or full data: URI)
  function toDataUri(val) {
    if (!val || val.startsWith('PASTE')) return null;
    return val.startsWith('data:') ? val : `data:image/png;base64,${val}`;
  }

  const bgPage1 = (typeof PAGE1_B64 !== 'undefined') ? toDataUri(PAGE1_B64) : null;
  const bgPage2 = (typeof PAGE2_B64 !== 'undefined') ? toDataUri(PAGE2_B64) : null;

  const elPage1 = document.querySelector('.page-1');
  const elPage2 = document.querySelector('.page-2');

  function setBgVisible(visible) {
    if (elPage1) elPage1.style.backgroundImage = (visible && bgPage1) ? `url(${bgPage1})` : '';
    if (elPage2) elPage2.style.backgroundImage = (visible && bgPage2) ? `url(${bgPage2})` : '';
  }

  // Show background on load
  setBgVisible(true);

  // Measure pixel width of a string using canvas (same font as inputs)
  const _canvas = document.createElement('canvas');
  const _ctx = _canvas.getContext('2d');
  function textWidth(str, font) {
    _ctx.font = font;
    return _ctx.measureText(str).width;
  }

  // Build 35 data rows per page
  function buildRows(tbodyId) {
    const tbody = document.getElementById(tbodyId);
    for (let i = 0; i < 35; i++) {
      const tr = document.createElement('tr');
      tr.innerHTML =
        `<td><input type="text" aria-label="Date/Time ${i+1}"></td>` +
        `<td><input type="text" class="notes-input" aria-label="Notes ${i+1}"></td>`;
      tbody.appendChild(tr);
    }
  }
  buildRows('body1');
  buildRows('body2');

  // Wire up line-flow behaviour for each table body
  document.querySelectorAll('.overlay-table tbody').forEach(tbody => {
    const notes = Array.from(tbody.querySelectorAll('input.notes-input'));

    notes.forEach((inp, idx) => {
      // Flow forward: push overflow text to next row
      inp.addEventListener('input', () => {
        if (idx >= notes.length - 1) return;
        const font = getComputedStyle(inp).font;
        const maxW = inp.clientWidth;
        if (textWidth(inp.value, font) <= maxW) return;

        // Find last character that still fits
        let cut = inp.value.length;
        while (cut > 0 && textWidth(inp.value.slice(0, cut), font) > maxW) cut--;

        // Prefer splitting at a word boundary
        const wordBound = inp.value.lastIndexOf(' ', cut);
        if (wordBound > 0) cut = wordBound + 1;

        const overflow = inp.value.slice(cut);
        inp.value = inp.value.slice(0, cut).trimEnd();

        const next = notes[idx + 1];
        next.value = overflow + next.value;
        next.focus();
        next.setSelectionRange(overflow.length, overflow.length);
      });

      // Flow back: Backspace at position 0 jumps to end of previous row
      inp.addEventListener('keydown', e => {
        if (e.key === 'Backspace' && inp.selectionStart === 0 && inp.selectionEnd === 0 && idx > 0) {
          e.preventDefault();
          const prev = notes[idx - 1];
          prev.focus();
          prev.setSelectionRange(prev.value.length, prev.value.length);
        }
      });
    });
  });

  // Live slider → CSS variable wiring
  const knobs = [
    { id: 's-top',       val: 'v-top',       css: '--table-top',       unit: 'mm' },
    { id: 's-left',      val: 'v-left',      css: '--table-left',      unit: 'mm' },
    { id: 's-date',      val: 'v-date',      css: '--date-col-width',  unit: 'mm' },
    { id: 's-notes',     val: 'v-notes',     css: '--notes-col-width', unit: 'mm' },
    { id: 's-row',       val: 'v-row',       css: '--row-height',      unit: 'mm' },
  ];

  knobs.forEach(({ id, val, css, unit }) => {
    const slider = document.getElementById(id);
    const display = document.getElementById(val);
    slider.addEventListener('input', () => {
      display.textContent = slider.value;
      root.style.setProperty(css, slider.value + unit);
    });
  });

  // PNG background toggle
  document.getElementById('toggle-bg').addEventListener('change', function () {
    setBgVisible(this.checked);
  });

  // Copy current CSS values to clipboard
  document.getElementById('copy-btn').addEventListener('click', () => {
    const lines = knobs.map(({ id, css, unit }) =>
      `    ${css}: ${document.getElementById(id).value}${unit};`
    );
    const snippet = `:root {\n${lines.join('\n')}\n}`;
    navigator.clipboard.writeText(snippet).then(() => {
      const msg = document.getElementById('copied-msg');
      msg.style.display = 'block';
      setTimeout(() => { msg.style.display = 'none'; }, 2000);
    });
  });
</script>
</body>
</html>
