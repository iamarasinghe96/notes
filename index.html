<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Progress Notes – AWH</title>
<style>
  /* ── ALIGNMENT KNOBS ────────────────────────────────────────────────────
     Tune these with the on-screen panel, then paste the values here and
     remove the #controls block.                                            */
  :root {
    --table-top:        52mm;   /* distance from top of page to table header */
    --date-col-width:   28mm;   /* width of Date/Time column                 */
    --notes-col-width: 148mm;   /* width of Notes column                     */
    --row-height:        7mm;   /* height of every row (header + data rows)  */
  }

  /* ── PAGE SETUP ─────────────────────────────────────────────────────── */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #888;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12mm;
    padding: 12mm 0 24mm;
  }

  /* A4 page shell */
  .page {
    position: relative;
    width:  210mm;
    height: 297mm;
    background: #fff;          /* white during alignment */
    background-size: 100% 100%;
    background-position: top left;
    background-repeat: no-repeat;
    box-shadow: 0 4px 16px #0006;
  }
  /* PNG backgrounds – injected via JS from assets/backgrounds.js */
  body.show-bg .page-1 { background-image: var(--bg-page1); }
  body.show-bg .page-2 { background-image: var(--bg-page2); }

  /* ── TABLE OVERLAY ───────────────────────────────────────────────────── */
  .overlay-table {
    position: absolute;
    top:  var(--table-top);
    left: 0;
    width: calc(var(--date-col-width) + var(--notes-col-width));
    border-collapse: collapse;
    table-layout: fixed;
  }

  .overlay-table th,
  .overlay-table td {
    height:  var(--row-height);
    border:  0.5pt solid #000;
    padding: 0 1.5mm;
    vertical-align: middle;
    overflow: hidden;
    background: transparent;
  }

  .col-date  { width: var(--date-col-width);  }
  .col-notes { width: var(--notes-col-width); }

  .overlay-table thead th {
    font: 700 6.5pt Arial, sans-serif;
    text-align: center;
    background: #fff8;
  }

  .overlay-table tbody td input {
    width: 100%;
    height: 100%;
    border: none;
    background: transparent;
    font: 8pt Arial, sans-serif;
    padding: 0;
    outline: none;
  }

  /* ── ALIGNMENT CONTROL PANEL (remove when done) ─────────────────────── */
  #controls {
    position: fixed;
    bottom: 12px;
    right:  12px;
    z-index: 999;
    background: #ffffffe8;
    border: 1px solid #999;
    border-radius: 8px;
    padding: 10px 14px;
    font: 12px Arial, sans-serif;
    box-shadow: 0 2px 12px #0004;
    min-width: 270px;
  }
  #controls h3 {
    font-size: 13px;
    margin-bottom: 8px;
    border-bottom: 1px solid #ccc;
    padding-bottom: 4px;
  }
  .ctrl-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
  }
  .ctrl-row label { flex: 0 0 145px; font-size: 11px; }
  .ctrl-row input[type=range] { flex: 1; }
  .ctrl-row .val {
    flex: 0 0 36px;
    text-align: right;
    font-size: 11px;
    font-family: monospace;
  }
  #copy-btn {
    margin-top: 8px;
    width: 100%;
    padding: 5px;
    font-size: 12px;
    cursor: pointer;
    background: #1a73e8;
    color: #fff;
    border: none;
    border-radius: 4px;
  }
  #copy-btn:hover { background: #1558b0; }
  #copied-msg {
    font-size: 11px;
    color: green;
    text-align: center;
    margin-top: 4px;
    display: none;
  }

  @media print {
    body { background: none; padding: 0; gap: 0; }
    .page { box-shadow: none; page-break-after: always; }
    #controls { display: none; }
  }
</style>
</head>
<body>

<!-- ═══════════════════════════  PAGE 1  ═══════════════════════════ -->
<div class="page page-1">
  <table class="overlay-table">
    <colgroup>
      <col class="col-date">
      <col class="col-notes">
    </colgroup>
    <thead>
      <tr>
        <th>Date / Time</th>
        <th>Please sign each entry and print surname and designation</th>
      </tr>
    </thead>
    <tbody id="body1"></tbody>
  </table>
</div>

<!-- ═══════════════════════════  PAGE 2  ═══════════════════════════ -->
<div class="page page-2">
  <table class="overlay-table">
    <colgroup>
      <col class="col-date">
      <col class="col-notes">
    </colgroup>
    <thead>
      <tr>
        <th>Date / Time</th>
        <th>Please sign each entry and print surname and designation</th>
      </tr>
    </thead>
    <tbody id="body2"></tbody>
  </table>
</div>

<!-- ═══════════ ALIGNMENT CONTROL PANEL (remove when done) ═══════════ -->
<div id="controls">
  <h3>Table Alignment Tool</h3>

  <div class="ctrl-row">
    <label>Table top offset (mm)</label>
    <input type="range" id="s-top"   min="30" max="100" step="0.5" value="52">
    <span class="val" id="v-top">52</span>
  </div>
  <div class="ctrl-row">
    <label>Date/Time col width (mm)</label>
    <input type="range" id="s-date"  min="15" max="60"  step="0.5" value="28">
    <span class="val" id="v-date">28</span>
  </div>
  <div class="ctrl-row">
    <label>Notes col width (mm)</label>
    <input type="range" id="s-notes" min="80" max="185" step="0.5" value="148">
    <span class="val" id="v-notes">148</span>
  </div>
  <div class="ctrl-row">
    <label>Row height (mm)</label>
    <input type="range" id="s-row"   min="4"  max="12"  step="0.25" value="7">
    <span class="val" id="v-row">7</span>
  </div>

  <div class="ctrl-row" style="margin-top:8px;">
    <label style="flex:0 0 auto;">Show PNG background</label>
    <input type="checkbox" id="toggle-bg" style="width:16px;height:16px;cursor:pointer;">
  </div>

  <button id="copy-btn">Copy CSS values</button>
  <div id="copied-msg">Copied to clipboard!</div>
</div>

<script src="assets/backgrounds.js"></script>
<script>
  // Apply base64 backgrounds as CSS variables (if placeholders have been replaced)
  const root = document.documentElement;
  if (typeof PAGE1_B64 !== 'undefined' && !PAGE1_B64.startsWith('PASTE')) {
    root.style.setProperty('--bg-page1', `url(data:image/png;base64,${PAGE1_B64})`);
  }
  if (typeof PAGE2_B64 !== 'undefined' && !PAGE2_B64.startsWith('PASTE')) {
    root.style.setProperty('--bg-page2', `url(data:image/png;base64,${PAGE2_B64})`);
  }

  // Generate 35 data rows for a given tbody
  function buildRows(tbodyId) {
    const tbody = document.getElementById(tbodyId);
    for (let i = 0; i < 35; i++) {
      const tr = document.createElement('tr');
      tr.innerHTML =
        `<td><input type="text" aria-label="Date/Time ${i+1}"></td>` +
        `<td><input type="text" aria-label="Notes ${i+1}"></td>`;
      tbody.appendChild(tr);
    }
  }
  buildRows('body1');
  buildRows('body2');

  // Live alignment sliders
  const root = document.documentElement;
  const knobs = [
    { id: 's-top',   val: 'v-top',   css: '--table-top',       unit: 'mm' },
    { id: 's-date',  val: 'v-date',  css: '--date-col-width',  unit: 'mm' },
    { id: 's-notes', val: 'v-notes', css: '--notes-col-width', unit: 'mm' },
    { id: 's-row',   val: 'v-row',   css: '--row-height',      unit: 'mm' },
  ];
  knobs.forEach(({ id, val, css, unit }) => {
    const slider = document.getElementById(id);
    const label  = document.getElementById(val);
    slider.addEventListener('input', () => {
      label.textContent = slider.value;
      root.style.setProperty(css, slider.value + unit);
    });
  });

  // Toggle PNG background on/off
  document.getElementById('toggle-bg').addEventListener('change', function() {
    document.body.classList.toggle('show-bg', this.checked);
  });

  // Copy current values as CSS snippet
  document.getElementById('copy-btn').addEventListener('click', () => {
    const lines = knobs.map(({ id, css, unit }) =>
      `    ${css}: ${document.getElementById(id).value}${unit};`
    );
    const snippet = `:root {\n${lines.join('\n')}\n}`;
    navigator.clipboard.writeText(snippet).then(() => {
      const msg = document.getElementById('copied-msg');
      msg.style.display = 'block';
      setTimeout(() => { msg.style.display = 'none'; }, 2000);
    });
  });
</script>
</body>
</html>
